name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: '27.2.12479018'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Android Rust targets and cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK packages and NDK
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Using Android SDK at: $SDK_DIR"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;35.0.0"
          if [ -z "${ANDROID_NDK_ROOT:-}" ] || [ ! -d "$ANDROID_NDK_ROOT" ]; then
            "$SDKMANAGER" "ndk;${NDK_VERSION}"
            echo "ANDROID_NDK_HOME=$SDK_DIR/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
            echo "ANDROID_NDK_ROOT=$SDK_DIR/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          else
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run Rust protocol, storage & Android core tests
        run: cargo test --locked -p touchpad-protocol -p touchpad-storage -p touchpad-android-core

      - name: Build Android native Rust libraries (.so)
        run: |
          cargo ndk -P 24 -t arm64-v8a -t armeabi-v7a -t x86_64 -o android-app/src/main/jniLibs build --locked --release -p touchpad-android-core

      - name: Build Debug APK
        run: |
          gradle --no-daemon --max-workers=2 "-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" :android-app:assembleDebug
          mkdir -p dist
          cp android-app/build/outputs/apk/debug/android-app-debug.apk "dist/TouchPadRemote-Android-${GITHUB_REF_NAME:-dev}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: touchpad-android
          path: dist/TouchPadRemote-Android-*.apk
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: touchpad-android
          path: dist
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TouchPad Remote Android ${{ github.ref_name }}"
          body: |
            ## TouchPad Remote — Aplicativo Android (${{ github.ref_name }})

            Transforme seu celular Android em um touchpad sem fio com motor nativo em **Rust (JNI)** e troca automática **Multi-PC pela borda da tela** orquestrada pelo celular.

            ### Download
            Baixe o APK abaixo e instale no celular.

            ### Novidades v2.0
            - **Motor 100% Rust via JNI** (`libtouchpad_android_core.so`) para UDP, pareamento, descoberta LAN, persistência e roteamento Multi-PC.
            - **Multi-PC por bordas**: conecte o celular a 2 ou mais PCs e passe o cursor de um PC ao outro ao encostar na borda configurada — sem nenhuma conexão direta entre os PCs.
            - **Travar PC & Troca Manual** na barra discreta da tela cheia (ideal para jogos 3D como Minecraft).
            - **Configurações salvas**: tempo de segurar clique, sensibilidade local, vibração háptica e orientação padrão.

            ### Servidores Desktop (Windows e Linux)
            - **Windows**: https://github.com/Henzogabriel954/TouchPadRemote-Windows/releases/latest
            - **Linux**: https://github.com/Henzogabriel954/TouchPadRemote-Linux/releases/latest
          files: dist/TouchPadRemote-Android-*.apk
          fail_on_unmatched_files: true

